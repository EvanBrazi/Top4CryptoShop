<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - متجر العملات الرقمية</title>
    <style>
        :root {
            /* ألوان الثيم النهاري */
            --day-bg: #f5f5f5;
            --day-text: #333;
            --day-primary: #d4a76a;
            --day-primary-hover: #c29555;
            --day-secondary: #e8d5b5;
            --day-card: #fff9f0;
            --day-border: #d8c8a8;
            --day-navbar: #5d4a36;
            --day-sidebar: #f1e8de;
            --day-shadow: rgba(93, 74, 54, 0.15);
            --day-accent: #e6b422;
            --day-footer: #8B4513;
            --day-navbar-text: #f5f5f5;
            --day-sidebar-header: #d4a76a;
            --day-sidebar-footer: #8B4513;
            --day-sidebar-content: #f8f8f8;
            --day-border-menu-link: 1px solid rgba(0, 0, 0, 0.1);
            --day-background-menu-l: rgba(255, 255, 255, 0.7);
            --day-border-left: 1px solid rgba(0, 0, 0, 0.1);

            /* ألوان الثيم الليلي */
            --night-bg: #1a1a2e;
            --night-text: #f0f0f0;
            --night-primary: #4a90e2;
            --night-primary-hover: #3a7bc8;
            --night-secondary: #5c6bc0;
            --night-card: #1e1e2a;
            --night-border: #333344;
            --night-navbar: #12121a;
            --night-sidebar: #1a1a22;
            --night-shadow: rgba(0, 0, 0, 0.4);
            --night-accent: #8a7cff;
            --night-footer: #0f3460;
            --night-navbar-text: #e0e0e0;
            --night-sidebar-header: #4a90e2;
            --night-sidebar-footer: #0f3460;
            --night-sidebar-content: #1e2a4a;
            --night-border-menu-link: 1px solid rgba(255, 255, 255, 0.1);
            --night-background-menu-l: rgba(0, 0, 0, 0.2);
            --night-border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* الثيمات */
        .day-theme {
            --bg-color: var(--day-bg);
            --text-color: var(--day-text);
            --primary-color: var(--day-primary);
            --primary-hover: var(--day-primary-hover);
            --secondary-color: var(--day-secondary);
            --card-color: var(--day-card);
            --border-color: var(--day-border);
            --navbar-color: var(--day-navbar);
            --sidebar-color: var(--day-sidebar);
            --sidebar-header-color: var(--day-sidebar-header);
            --sidebar-content-color: var(--day-sidebar-content);
            --sidebar-footer-color: var(--day-sidebar-footer);
            --shadow-color: var(--day-shadow);
            --accent-color: var(--day-accent);
            --bar-footer-color: var(--day-footer);
            --navbar-text: var(--day-navbar-text);
            --divider-color: rgba(0, 0, 0, 0.1);
            --social-icon-color: white;
            --border-menu-link: var(--day-border-menu-link);
            --background-menu-link: var(--day-background-menu-l);
            --sidebar-border-left: var(--day-border-left);
        }

        .night-theme {
            --bg-color: var(--night-bg);
            --text-color: var(--night-text);
            --primary-color: var(--night-primary);
            --primary-hover: var(--night-primary-hover);
            --secondary-color: var(--night-secondary);
            --card-color: var(--night-card);
            --border-color: var(--night-border);
            --navbar-color: var(--night-navbar);
            --sidebar-color: var(--night-sidebar);
            --sidebar-header-color: var(--night-sidebar-header);
            --sidebar-content-color: var(--night-sidebar-content);
            --sidebar-footer-color: var(--night-sidebar-footer);
            --shadow-color: var(--night-shadow);
            --accent-color: var(--night-accent);
            --bar-footer-color: var(--night-footer);
            --navbar-text: var(--night-navbar-text);
            --divider-color: rgba(255, 255, 255, 0.1);
            --social-icon-color: white;
            --border-menu-link: var(--night-border-menu-link);
            --background-menu-link: var(--night-background-menu-l);
            --sidebar-border-left: var(--night-border-left);
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: var(--card-color);
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            border: 1px solid var(--border-color);
            position: relative;
        }

        h2 {
            color: var(--text-color);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-color);
            color: var(--text-color);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-google {
            background-color: #DB4437;
            color: white;
            margin-top: 15px;
        }

        .btn-apple {
            background-color: #000000;
            color: white;
            margin-top: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-color);
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        .links {
            text-align: center;
            margin-top: 15px;
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* تنسيق رسالة الخطأ */
        .error-message {
            color: #ff0000;
            font-size: 0.85rem;
            margin-top: 5px;
            padding: 8px;
            border-radius: 4px;
            background-color: rgba(255, 0, 0, 0.1);
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* تنسيق رسالة الخطأ العامة */
        .general-error {
            color: #ff0000;
            background-color: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .general-error.show {
            display: block;
        }
    </style>
    <!-- تعريف تسجيل الدخول عبر Google -->
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="day-theme">
    <div class="container">
        <h2>تسجيل الدخول</h2>

        <!-- رسالة خطأ عامة -->
        <div id="generalError" class="general-error"></div>

        <!-- زر تسجيل الدخول عبر Google -->
        <button class="btn-google" id="googleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20"
                alt="Google">
            تسجيل الدخول عبر Google
        </button>

        <!-- زر تسجيل الدخول عبر Apple -->
        <button class="btn-apple" id="appleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="20" alt="Apple">
            تسجيل الدخول عبر Apple
        </button>

        <div class="divider">أو</div>

        <!-- نموذج تسجيل الدخول التقليدي -->
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="اسم المستخدم" required autocomplete="username">
                <div id="usernameError" class="error-message"></div>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="كلمة المرور" required minlength="8"
                    autocomplete="current-password">
                <div id="passwordError" class="error-message"></div>
                <div id="attemptsWarning" class="error-message" style="color: red; font-weight: bold;"></div>
            </div>
            <!-- إضافة مؤشر تحميل -->
            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnText">تسجيل الدخول</span>
                <div id="spinner" class="spinner" style="display:none;"></div>
            </button>
        </form>

        <div class="links">
            <a href="forget-password.html">نسيت كلمة المرور؟</a> |
            <a href="signup.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        /**
         * ✅ تطبيق الثيم المحفوظ في localStorage
         * يضبط مظهر الصفحة حسب تفضيل المستخدم
         */
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'day';
            document.body.classList.remove('day-theme', 'night-theme');
            document.body.classList.add(`${savedTheme}-theme`);
        });

        /**
         * ✅ تسجيل الدخول عبر Google
         * يعيد توجيه المستخدم إلى صفحة المصادقة الخاصة بـ Google
         */
        const googleBtn = document.getElementById('googleSignIn');
        if (googleBtn) {
            googleBtn.addEventListener('click', () => {
                const googleAuthUrl = new URL('https://accounts.google.com/o/oauth2/auth');
                googleAuthUrl.searchParams.set('response_type', 'code');
                googleAuthUrl.searchParams.set('client_id', 'YOUR_GOOGLE_CLIENT_ID');
                googleAuthUrl.searchParams.set('redirect_uri', 'https://top4cryptoshop.onrender.com/api/auth/google/callback');
                googleAuthUrl.searchParams.set('scope', 'email profile');
                googleAuthUrl.searchParams.set('state', crypto.randomUUID());
                window.location.href = googleAuthUrl.toString();
            });
        }

        /**
         * ✅ تسجيل الدخول عبر Apple
         */
        const appleBtn = document.getElementById('appleSignIn');
        if (appleBtn) {
            appleBtn.addEventListener('click', () => {
                const appleAuthUrl = new URL('https://appleid.apple.com/auth/authorize');
                appleAuthUrl.searchParams.set('client_id', 'YOUR_APPLE_SERVICE_ID');
                appleAuthUrl.searchParams.set('redirect_uri', 'https://top4cryptoshop.onrender.com/api/auth/apple/callback');
                appleAuthUrl.searchParams.set('response_type', 'code');
                appleAuthUrl.searchParams.set('scope', 'email name');
                appleAuthUrl.searchParams.set('response_mode', 'form_post');
                window.location.href = appleAuthUrl.toString();
            });
        }

        /**
         * ✅ عرض رسالة خطأ في عنصر معين
         * @param {string} elementId - معرف العنصر
         * @param {string} message - نص الرسالة
         */
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            if (el) {
                el.textContent = message;
                el.classList.add('show');
            }
        }

        /**
         * ✅ عرض رسالة خطأ عامة
         * @param {string} message
         */
        function showLoginError(message) {
            const generalError = document.getElementById('generalError');
            if (generalError) {
                generalError.textContent = message;
                generalError.classList.add('show');
            }
        }

        /**
         * ✅ تنفيذ عملية تسجيل الدخول التقليدي
         * @param {string} username
         * @param {string} password
         */
        async function loginUser(username, password) {
            try {
                // جلب رمز CSRF
                const csrfRes = await fetch("/csrf-token");
                if (!csrfRes.ok) throw new Error("فشل في جلب رمز CSRF");
                const { csrfToken } = await csrfRes.json();

                // إرسال بيانات الدخول
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-csrf-token': csrfToken
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const result = await loginRes.json();

                // التعامل مع الأخطاء الخاصة
                if (result.type === 'invalid_password' && result.remainingAttempts !== undefined) {
                    showError('attemptsWarning', `❌ تبقّى ${result.remainingAttempts} محاولة قبل تعليق الحساب`);
                    return;
                }

                if (result.type === 'too_many_attempts') {
                    const suspendedMessage = `
          🚫 تم تعليق الحساب مؤقتًا بسبب عدد المحاولات.
          <br>📞 يمكنك مراسلتنا عبر <a href="https://wa.me/+963980217649" target="_blank" style="color:green;font-weight:bold;">واتساب</a>
          أو الضغط هنا لإرسال طلب إعادة التفعيل.
        `;
                    const generalError = document.getElementById('generalError');
                    generalError.innerHTML = suspendedMessage;
                    generalError.classList.add('show');
                    return;
                }

                if (!loginRes.ok || !result.success) {
                    throw new Error(result.error || 'حدث خطأ أثناء تسجيل الدخول');
                }

                // تسجيل الدخول ناجح
                console.log("✅ تسجيل الدخول ناجح:", result.user);
                localStorage.setItem('userRole', result.user.role);
                localStorage.setItem('username', result.user.username);

                // التوجيه حسب الدور
                const roleRedirects = {
                    admin: '/protectedViews/admin.html',
                    user: '/homepage.html',
                    moderator: '/moderator/dashboard.html',
                    support: '/support/center.html'
                };

                const redirectPath = result.redirectTo || roleRedirects[result.user.role] || '/homepage.html';
                window.location.href = redirectPath;

            } catch (err) {
                console.error("🚨 خطأ أثناء تسجيل الدخول:", err);
                showLoginError(err.message || 'حدث خطأ غير متوقع. حاول لاحقًا.');
            }
        }

        /**
         * ✅ ربط النموذج بعملية تسجيل الدخول
         */
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // تنظيف الأخطاء السابقة
                document.querySelectorAll('.error-message').forEach(el => {
                    el.classList.remove('show');
                    el.textContent = '';
                });

                const generalError = document.getElementById('generalError');
                generalError.classList.remove('show');
                generalError.textContent = '';

                const username = document.getElementById('username')?.value.trim();
                const password = document.getElementById('password')?.value;

                if (!username || !password) {
                    showLoginError('يرجى إدخال اسم المستخدم وكلمة المرور');
                    return;
                }

                await loginUser(username, password);
            });
        }
    </script>

</body>

</html>
