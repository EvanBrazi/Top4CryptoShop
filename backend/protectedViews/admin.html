<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن</title>
  <link rel="stylesheet" href="./assets/css/admin.css">
  <!-- Author: Evan Brazi | Last Updated: 2025-08-19 -->
</head>

<body>
  <header>
    <h1>لوحة تحكم الأدمن</h1>
    <div id="connectionStatus" class="status-bar">🟢 متصل</div>
    <div id="globalNotification" class="notification-bar"></div>
    <div id="backupNotifications"></div>
  </header>
  <div class="notification-tester">
    <h3>🧪 اختبار الإشعارات</h3>
    <label>نوع الإشعار:</label>
    <select id="notification-type">
      <option value="orderAccepted">طلب مقبول</option>
      <option value="orderRejected">طلب مرفوض</option>
      <option value="paymentAccepted">دفعة مقبولة</option>
      <option value="paymentRejected">دفعة مرفوضة</option>
    </select>

    <label>معرف المستخدم:</label>
    <input type="text" id="target-user-id" placeholder="مثال: 68b663f8fab68380fedce1f9">

    <button type="button" id="test-button">📤 إرسال إشعار تجريبي</button>
  </div>
  <main>
    <!-- 🧾 نموذج تعديل رصيد مستخدم -->
    <section class="card">
      <h2>💰 تحديث رصيد مستخدم</h2>
      <label for="userId">معرف المستخدم</label>
      <input id="userId" placeholder="12345">
      <label for="newBalance">الرصيد الجديد</label>
      <input id="newBalance" placeholder="100.00">
      <button id="updateBalanceBtn">💾 تحديث</button>
      <div id="balanceResult" class="status-message"></div>
    </section>

    <!-- 🔐 نموذج تغيير حالة المستخدم -->
    <section class="card">
      <h2>🔄 تغيير حالة المستخدم</h2>
      <label for="statusUserId">معرف المستخدم</label>
      <input id="statusUserId" placeholder="12345">
      <label for="newStatus">الحالة الجديدة</label>
      <select id="newStatus">
        <option value="active">نشط</option>
        <option value="suspended">معلّق</option>
        <option value="deactivated">محذوف</option>
      </select>
      <button id="updateStatusBtn">🔄 تحديث الحالة</button>
      <div id="statusResult" class="status-message"></div>
    </section>

    <!-- 👥 جدول المستخدمين -->
    <section class="card">
      <h2>👥 قائمة المستخدمين</h2>
      <div id="admin-notifications" class="notifications"></div>
      <table id="usersTable">
        <thead>
          <tr>
            <th>المعرف</th>
            <th>اسم المستخدم</th>
            <th>الرقم</th>
            <th>الرصيد</th>
            <th>الحالة</th>
            <th>عدد المحاولات</th>
            <th>آخر دخول</th>
            <th>✏️ تعديل</th>
            <th>🗑️ حذف</th>
            <th>🔓 فك الحظر</th>
          </tr>
        </thead>
        <tbody>
          <!-- يتم تعبئة الصفوف ديناميكيًا من admin.js -->
        </tbody>
      </table>
    </section>
    <script type="module" src="./assets/js/admin.js"></script>
</body>

</html>
