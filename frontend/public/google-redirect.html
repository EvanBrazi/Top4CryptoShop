<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جارٍ تسجيل الدخول...</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f9f9f9;
            color: #333;
        }

        .loader {
            margin-top: 30px;
            border: 6px solid #eee;
            border-top: 6px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .welcome {
            font-size: 1.2em;
            margin-top: 20px;
            color: #4CAF50;
        }
    </style>
</head>

<body>
    <h2>🔐 جارٍ تسجيل الدخول عبر Google...</h2>
    <div class="loader"></div>
    <div class="welcome" id="welcomeMessage"></div>

    <script type="module" src="./assets/js/google-redirect.js"></script>
</body>

</html>
