<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - تحسين تبويب الإعدادات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6cf7;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --body-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
            --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        .night-theme {
            --body-bg: #1a1d21;
            --card-bg: #24292d;
            --text-color: #e4e6eb;
            --border-color: #3e4248;
            --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--body-bg);
            color: var(--text-color);
            line-height: 1.6;
            transition: var(--transition);
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .settings-tab {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            margin-top: 20px;
        }

        .settings-tab h2 {
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-color);
            color: var(--text-color);
            font-size: 1.75rem;
        }

        .settings-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .avatar-section {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
            padding: 1.5rem;
            background-color: var(--body-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .avatar-section img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            margin-bottom: 1rem;
        }

        .avatar-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group input {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--body-bg);
            color: var(--text-color);
            transition: var(--transition);
            width: 100%;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.25);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .save-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            margin-top: 1rem;
            width: 100%;
        }

        .save-btn:hover {
            background-color: #3a5ad9;
            transform: translateY(-2px);
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* تحسينات للشاشات الصغيرة */
        @media (max-width: 768px) {
            .settings-tab {
                padding: 1.5rem;
                margin: 10px;
            }

            .settings-form {
                grid-template-columns: 1fr;
            }

            .avatar-section {
                padding: 1rem;
            }

            .avatar-section img {
                width: 100px;
                height: 100px;
            }

            .avatar-actions {
                flex-direction: column;
                width: 100%;
            }

            .avatar-actions button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .settings-tab {
                padding: 1rem;
            }

            .settings-tab h2 {
                font-size: 1.5rem;
            }

            .form-group input {
                padding: 0.6rem 0.8rem;
            }

            .save-btn {
                padding: 0.6rem 1rem;
            }
        }

        /* تنسيقات إضافية للثيمات */
        .theme-toggle {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>

<body class="day-theme">
    <div class="container">
        <div class="settings-tab">
            <h2><i class="fas fa-cog"></i> إعدادات الحساب</h2>
            <form id="settings-form" class="settings-form">
                <div class="avatar-section">
                    <img id="avatar-preview" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDExQzE0LjIwOTEgMTEgMTYgOS4yMDkxIDE2IDdDMTYgNC43OTA4NiAxNC4yMDkxIDMgMTIgM0M5Ljc5MDg2IDMgOCA0Ljc5MDg2IDggN0M4IDkuMjA5MTQgOS43OTA4NiAxMSAxMiAxMVoiIGZpbGw9IiNjY2MiLz4KPHBhdGggZD0iTTEyIDIxQzE2Ljk3MDYgMjEgMjEgMTYuOTcwNiAyMSAxMkMyMSA3LjAyOTQ0IDE2Ljk3MDYgMyAxMiAzQzcuMDI5NDQgMyAzIDcuMDI5NDQgMyAxMkMzIDE2Ljk3MDYgNy4wMjk0NCAyMSAxMiAyMVoiIHN0cm9rZT0iI2NjYyIgc3Ryb2tlLXdpZHRoPSIyIi8+Cjwvc3ZnPg==" alt="الصورة الشخصية" />
                    <div class="avatar-actions">
                        <input type="file" id="avatar-input" accept="image/*" style="display: none;" />
                        <button type="button" class="btn btn-primary" onclick="document.getElementById('avatar-input').click()">
                            <i class="fas fa-upload"></i> تغيير الصورة
                        </button>
                        <button type="button" class="btn btn-danger" id="remove-avatar-btn">
                            <i class="fas fa-trash"></i> إزالة الصورة
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullName"><i class="fas fa-user"></i> الاسم الكامل</label>
                    <input type="text" id="fullName" autocomplete="username" placeholder="أدخل اسمك الكامل" />
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                    <input type="email" id="email" autocomplete="email" placeholder="أدخل بريدك الإلكتروني" />
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> رقم الهاتف</label>
                    <input type="tel" id="phone" autocomplete="tel" placeholder="أدخل رقم هاتفك" />
                </div>

                <div class="form-group">
                    <label for="newPassword"><i class="fas fa-lock"></i> كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" autocomplete="new-password" placeholder="أدخل كلمة المرور الجديدة" />
                </div>

                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-lock"></i> تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="أكد كلمة المرور الجديدة" />
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="save-btn">
                        <i class="fas fa-save"></i> حفظ التغييرات
                    </button>
                </div>
            </form>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button id="theme-toggle-btn" class="theme-toggle">
                <i class="fas fa-moon"></i> تبديل الثيم
            </button>
        </div>
    </div>

    <script>
        // تبديل الثيم
        document.getElementById('theme-toggle-btn').addEventListener('click', function() {
            document.body.classList.toggle('day-theme');
            document.body.classList.toggle('night-theme');
            
            const isNightTheme = document.body.classList.contains('night-theme');
            this.innerHTML = isNightTheme ? 
                '<i class="fas fa-sun"></i> تبديل إلى الوضع النهاري' : 
                '<i class="fas fa-moon"></i> تبديل إلى الوضع الليلي';
        });

        // معاينة الصورة عند اختيارها
        document.getElementById('avatar-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('avatar-preview').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // إزالة الصورة
        document.getElementById('remove-avatar-btn').addEventListener('click', function() {
            document.getElementById('avatar-preview').src = "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDExQzE0LjIwOTEgMTEgMTYgOS4yMDkxIDE2IDdDMTYgNC43OTA4NiAxNC4yMDkxIDMgMTIgM0M5Ljc5MDg2IDMgOCA0Ljc5MDg2IDggN0M4IDkuMjA5MTQgOS43OTA4NiAxMSAxMiAxMVoiIGZpbGw9IiNjY2MiLz4KPHBhdGggZD0iTTEyIDIxQzE2Ljk3MDYgMjEgMjEgMTYuOTcwNiAyMSAxMkMyMSA3LjAyOTQ0IDE2Ljk3MDYgMyAxMiAzQzcuMDI5NDQgMyAzIDcuMDI5NDQgMyAxMkMzIDE2Ljk3MDYgNy4wMjk0NCAyMSAxMiAyMVoiIHN0cm9rZT0iI2NjYyIgc3Ryb2tlLXdpZHRoPSIyIi8+Cjwvc3ZnPg==";
            document.getElementById('avatar-input').value = '';
        });

        // منع إرسال النموذج (لأغراض العرض فقط)
        document.getElementById('settings-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم حفظ الإعدادات بنجاح!');
        });
    </script>
</body>

</html>
