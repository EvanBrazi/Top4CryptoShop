<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن</title>
  <link rel="stylesheet" href="./assets/css/admin.css">

  <!-- CSP-compliant: No inline styles or scripts -->
  <!-- Author: Evan Brazi | Created: 2025-08-16 -->
</head>
<body>

  <header>
    <h1>لوحة تحكم الأدمن</h1>
  </header>

  <main>
    <!-- 🧾 نموذج تعديل رصيد مستخدم -->
    <section class="card">
      <h2>تحديث رصيد مستخدم</h2>
      <input id="userId" placeholder="معرف المستخدم">
      <input id="newBalance" placeholder="الرصيد الجديد">
      <button id="updateBalanceBtn">تحديث</button>
    </section>

    <!-- 👥 جدول المستخدمين -->
    <section class="card">
      <h2>قائمة المستخدمين</h2>
      <table id="usersTable">
        <thead>
          <tr>
            <th>المعرف</th>
            <th>اسم المستخدم</th>
            <th>الرصيد</th>
            <th>الحالة</th>
            <th>عدد المحاولات</th>
            <th>آخر دخول</th>
            <th>تعديل</th>
            <th>حذف</th>
            <th>تفعيل</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 🖼️ جدول مراقبة الأيقونات -->
    <section class="card">
      <h2>مراقبة تحميل الأيقونات</h2>
      <table id="iconsTable">
        <thead>
          <tr>
            <th>رابط الأيقونة</th>
            <th>الحالة</th>
            <th>عدد المحاولات</th>
            <th>المدة (ms)</th>
            <th>معاينة</th>
            <th>إعادة المحاولة</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- ✅ External script only (CSP-safe) -->
  <script src="./assets/js/admin.js"></script>
</body>
</html>
