<div class="container">
    <h2>إيداع رصيد</h2>
    <div>رصيدك الحالي: <span id="currentBalance">0</span>$</div>
    <input type="number" id="amount" placeholder="المبلغ بالدولار" min="1">
    <button id="depositBtn">إيداع</button>
</div>

<script>
    // جلب الرصيد الحالي
    async function loadBalance() {
        const response = await fetch('/api/user/balance', {
            headers: { 'Authorization': localStorage.getItem('token') }
        });
        const data = await response.json();
        document.getElementById('currentBalance').textContent = data.balance;
    }

    // عملية الإيداع
    document.getElementById('depositBtn').addEventListener('click', async () => {
        const amount = parseFloat(document.getElementById('amount').value);
        const response = await fetch('/api/deposit', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('token')
            },
            body: JSON.stringify({ amount })
        });
        const result = await response.json();
        if (response.ok) {
            alert(`تم إيداع ${amount}$ بنجاح`);
            loadBalance();
        } else {
            alert(result.error || 'فشل عملية الإيداع');
        }
    });

    // تحميل الرصيد عند فتح الصفحة
    loadBalance();
</script>
