<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد - متجر العملات الرقمية</title>
    <style>
        :root {
            --beige: #F5F5DC;
            --chocolate: #D2691E;
            --dark-chocolate: #8B4513;
            --google-red: #DB4437;
            --apple-black: #000000;
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background: var(--beige);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.1);
            border: 1px solid var(--chocolate);
        }

        h2 {
            color: var(--dark-chocolate);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--chocolate);
            border-radius: 6px;
            font-size: 1rem;
            background: rgba(210, 105, 30, 0.05);
        }

        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 30%;
            min-width: 100px;
        }

        .phone-number {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--chocolate);
            color: white;
        }

        .btn-google {
            background-color: var(--google-red);
            color: white;
            margin-top: 15px;
        }

        .btn-apple {
            background-color: var(--apple-black);
            color: white;
            margin-top: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--dark-chocolate);
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--chocolate);
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        .error-message {
            color: red;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
    </style>
    <!-- تعريف تسجيل الدخول عبر Google -->
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <h2>إنشاء حساب جديد</h2>

        <!-- زر تسجيل الدخول عبر Google -->
        <button class="btn-google" id="googleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" alt="Google">
            التسجيل عبر Google
        </button>

        <!-- زر تسجيل الدخول عبر Apple -->
        <button class="btn-apple" id="appleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="20" alt="Apple">
            التسجيل عبر Apple
        </button>

        <div class="divider">أو</div>

        <!-- نموذج التسجيل التقليدي -->
        <form id="signupForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="اسم المستخدم" required>
                <div id="usernameError" class="error-message"></div>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="كلمة المرور" required minlength="6">
                <div id="passwordError" class="error-message"></div>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني (اختياري)">
                <div id="emailError" class="error-message"></div>
            </div>
            <div class="form-group">
                <div class="phone-input-group">
                    <select id="countryCode" class="country-code" required>
                        <option value="" disabled selected>رمز الدولة</option>
                        <option value="+966">🇸🇦 +966 (السعودية)</option>
                        <option value="+971">🇦🇪 +971 (الإمارات)</option>
                        <option value="+965">🇰🇼 +965 (الكويت)</option>
                        <option value="+968">🇴🇦 +968 (عمان)</option>
                        <option value="+974">🇶🇦 +974 (قطر)</option>
                        <option value="+973">🇧🇭 +973 (البحرين)</option>
                        <option value="+20">🇪🇬 +20 (مصر)</option>
                        <option value="+962">🇯🇴 +962 (الأردن)</option>
                        <option value="+963">🇸🇾 +963 (سوريا)</option>
                        <option value="+961">🇱🇧 +961 (لبنان)</option>
                        <option value="+964">🇮🇶 +964 (العراق)</option>
                        <option value="+212">🇲🇦 +212 (المغرب)</option>
                        <option value="+213">🇩🇿 +213 (الجزائر)</option>
                        <option value="+216">🇹🇳 +216 (تونس)</option>
                        <option value="+218">🇱🇾 +218 (ليبيا)</option>
                        <option value="+249">🇸🇩 +249 (السودان)</option>
                        <option value="+967">🇾🇪 +967 (اليمن)</option>
                        <option value="+1">🇺🇸 +1 (الولايات المتحدة)</option>
                        <option value="+44">🇬🇧 +44 (المملكة المتحدة)</option>
                    </select>
                    <input type="tel" id="phoneNumber" class="phone-number" placeholder="رقم الجوال" required>
                </div>
                <div id="phoneError" class="error-message"></div>
            </div>
            <button type="submit" class="btn-primary">تسجيل</button>
        </form>
    </div>

    <script>
        // 1. تسجيل الدخول عبر Google
        document.getElementById('googleSignIn').addEventListener('click', () => {
            // سيتم استبدال هذا بالتنفيذ الفعلي بعد إعداد مشروع Google
            window.location.href = 'https://accounts.google.com/o/oauth2/auth?' +
                'response_type=code&' +
                'client_id=YOUR_GOOGLE_CLIENT_ID&' +
                'redirect_uri=https://top4cryptoshop.onrender.com/api/auth/google/callback&' +
                'scope=email profile&' +
                'state=random_state_string';
        });

        // 2. تسجيل الدخول عبر Apple
        document.getElementById('appleSignIn').addEventListener('click', () => {
            // سيتم استبدال هذا بالتنفيذ الفعلي بعد إعداد Apple Developer Account
            window.location.href = 'https://appleid.apple.com/auth/authorize?' +
                'client_id=YOUR_APPLE_SERVICE_ID&' +
                'redirect_uri=https://top4cryptoshop.onrender.com/api/auth/apple/callback&' +
                'response_type=code&' +
                'scope=email name&' +
                'response_mode=form_post';
        });

        // 3. التسجيل التقليدي
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // إخفاء رسائل الخطأ السابقة
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const fullPhoneNumber = countryCode + phoneNumber;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        email: email || undefined,
                        phone: fullPhoneNumber
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'حدث خطأ أثناء التسجيل');
                }

                // إذا نجح التسجيل
                alert('تم تسجيل الحساب بنجاح!');
                window.location.href = '/dashboard.html';

            } catch (err) {
                console.error('Error:', err);
                
                // عرض رسائل الخطأ المناسبة
                if (err.message.includes('اسم المستخدم')) {
                    showError('usernameError', err.message);
                } else if (err.message.includes('كلمة المرور')) {
                    showError('passwordError', err.message);
                } else if (err.message.includes('الهاتف')) {
                    showError('phoneError', err.message);
                } else if (err.message.includes('البريد')) {
                    showError('emailError', err.message);
                } else {
                    showError('usernameError', 'حدث خطأ أثناء التسجيل. يرجى المحاولة لاحقاً');
                }
            }
        });

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }
    </script>
</body>
</html>
