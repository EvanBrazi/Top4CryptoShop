<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد - متجر العملات الرقمية</title>
    <style>
        :root {
            /* ألوان الثيم النهاري */
            --day-bg: #f5f5f5;
            --day-text: #333;
            --day-primary: #d4a76a;
            --day-primary-hover: #c29555;
            --day-secondary: #e8d5b5;
            --day-card: #fff9f0;
            --day-border: #d8c8a8;
            --day-navbar: #5d4a36;
            --day-sidebar: #f1e8de;
            --day-shadow: rgba(93, 74, 54, 0.15);
            --day-accent: #e6b422;
            --day-footer: #8B4513;
            --day-navbar-text: #f5f5f5;
            --day-sidebar-header: #d4a76a;
            --day-sidebar-footer: #8B4513;
            --day-sidebar-content: #f8f8f8;
            --day-border-menu-link: 1px solid rgba(0, 0, 0, 0.1);
            --day-background-menu-l: rgba(255, 255, 255, 0.7);
            --day-border-left: 1px solid rgba(0, 0, 0, 0.1);
            
            /* ألوان الثيم الليلي */
            --night-bg: #1a1a2e;
            --night-text: #f0f0f0;
            --night-primary: #4a90e2;
            --night-primary-hover: #3a7bc8;
            --night-secondary: #5c6bc0;
            --night-card: #1e1e2a;
            --night-border: #333344;
            --night-navbar: #12121a;
            --night-sidebar: #1a1a22;
            --night-shadow: rgba(0, 0, 0, 0.4);
            --night-accent: #8a7cff;
            --night-footer: #0f3460;
            --night-navbar-text: #e0e0e0;
            --night-sidebar-header: #4a90e2;
            --night-sidebar-footer: #0f3460;
            --night-sidebar-content: #1e2a4a;
            --night-border-menu-link: 1px solid rgba(255, 255, 255, 0.1);
            --night-background-menu-l: rgba(0, 0, 0, 0.2);
            --night-border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* الثيمات */
        .day-theme {
            --bg-color: var(--day-bg);
            --text-color: var(--day-text);
            --primary-color: var(--day-primary);
            --primary-hover: var(--day-primary-hover);
            --secondary-color: var(--day-secondary);
            --card-color: var(--day-card);
            --border-color: var(--day-border);
            --navbar-color: var(--day-navbar);
            --sidebar-color: var(--day-sidebar);
            --sidebar-header-color: var(--day-sidebar-header);
            --sidebar-content-color: var(--day-sidebar-content);
            --sidebar-footer-color: var(--day-sidebar-footer);
            --shadow-color: var(--day-shadow);
            --accent-color: var(--day-accent);
            --bar-footer-color: var(--day-footer);
            --navbar-text: var(--day-navbar-text);
            --divider-color: rgba(0, 0, 0, 0.1);
            --social-icon-color: white;
            --border-menu-link: var(--day-border-menu-link);
            --background-menu-link: var(--day-background-menu-l);
            --sidebar-border-left: var(--day-border-left);
        }

        .night-theme {
            --bg-color: var(--night-bg);
            --text-color: var(--night-text);
            --primary-color: var(--night-primary);
            --primary-hover: var(--night-primary-hover);
            --secondary-color: var(--night-secondary);
            --card-color: var(--night-card);
            --border-color: var(--night-border);
            --navbar-color: var(--night-navbar);
            --sidebar-color: var(--night-sidebar);
            --sidebar-header-color: var(--night-sidebar-header);
            --sidebar-content-color: var(--night-sidebar-content);
            --sidebar-footer-color: var(--night-sidebar-footer);
            --shadow-color: var(--night-shadow);
            --accent-color: var(--night-accent);
            --bar-footer-color: var(--night-footer);
            --navbar-text: var(--night-navbar-text);
            --divider-color: rgba(255, 255, 255, 0.1);
            --social-icon-color: white;
            --border-menu-link: var(--night-border-menu-link);
            --background-menu-link: var(--night-background-menu-l);
            --sidebar-border-left: var(--night-border-left);
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: var(--card-color);
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            border: 1px solid var(--border-color);
            position: relative;
        }

        h2 {
            color: var(--text-color);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            width: 100%;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-color);
            color: var(--text-color);
        }

        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 30%;
            min-width: 100px;
        }

        .phone-number {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-google {
            background-color: #DB4437;
            color: white;
            margin-top: 15px;
        }

        .btn-apple {
            background-color: #000000;
            color: white;
            margin-top: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-color);
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        .error-message {
            color: #ff0000;
            font-size: 0.85rem;
            margin-top: 5px;
            padding: 8px;
            border-radius: 4px;
            background-color: rgba(255, 0, 0, 0.1);
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        /* تنسيق رسالة الخطأ العامة */
        .general-error {
            color: #ff0000;
            background-color: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .general-error.show {
            display: block;
        }
    </style>
    <!-- تعريف تسجيل الدخول عبر Google -->
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="day-theme">
    <div class="container">
        <h2>إنشاء حساب جديد</h2>
        
        <!-- رسالة خطأ عامة -->
        <div id="generalError" class="general-error"></div>

        <!-- زر تسجيل الدخول عبر Google -->
        <button class="btn-google" id="googleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" alt="Google">
            التسجيل عبر Google
        </button>

        <!-- زر تسجيل الدخول عبر Apple -->
        <button class="btn-apple" id="appleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="20" alt="Apple">
            التسجيل عبر Apple
        </button>

        <div class="divider">أو</div>

        <!-- نموذج التسجيل التقليدي -->
        <form id="signupForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="اسم المستخدم" required autocomplete="username">
                <div id="usernameError" class="error-message"></div>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="كلمة المرور" required minlength="8" autocomplete="new-password">
                <div id="passwordError" class="error-message"></div>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <div id="emailError" class="error-message"></div>
            </div>
            <div class="form-group">
                <div class="phone-input-group">
                    <select id="countryCode" class="country-code" required title="رمز الدولة">
                        <option value="" disabled selected>رمز الدولة</option>
                        <option value="+966">🇸🇦 +966 (السعودية)</option>
                        <option value="+971">🇦🇪 +971 (الإمارات)</option>
                        <option value="+965">🇰🇼 +965 (الكويت)</option>
                        <option value="+968">🇴🇦 +968 (عمان)</option>
                        <option value="+974">🇶🇦 +974 (قطر)</option>
                        <option value="+973">🇧🇭 +973 (البحرين)</option>
                        <option value="+20">🇪🇬 +20 (مصر)</option>
                        <option value="+962">🇯🇴 +962 (الأردن)</option>
                        <option value="+963">🇸🇾 +963 (سوريا)</option>
                        <option value="+961">🇱🇧 +961 (لبنان)</option>
                        <option value="+964">🇮🇶 +964 (العراق)</option>
                        <option value="+212">🇲🇦 +212 (المغرب)</option>
                        <option value="+213">🇩🇿 +213 (الجزائر)</option>
                        <option value="+216">🇹🇳 +216 (تونس)</option>
                        <option value="+218">🇱🇾 +218 (ليبيا)</option>
                        <option value="+249">🇸🇩 +249 (السودان)</option>
                        <option value="+967">🇾🇪 +967 (اليمن)</option>
                        <option value="+1">🇺🇸 +1 (الولايات المتحدة)</option>
                        <option value="+44">🇬🇧 +44 (المملكة المتحدة)</option>
                    </select>
                    <input type="tel" id="phoneNumber" class="phone-number" placeholder="رقم الجوال" required>
                </div>
                <div id="phoneError" class="error-message"></div>
            </div>
            <button type="submit" class="btn-primary">تسجيل</button>
        </form>
    </div>

    <script>
        // تطبيق الثيم المحفوظ في localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'day';
            document.body.classList.remove('day-theme', 'night-theme');
            document.body.classList.add(`${savedTheme}-theme`);
        });

        // 1. تسجيل الدخول عبر Google
        document.getElementById('googleSignIn').addEventListener('click', () => {
            // سيتم استبدال هذا بالتنفيذ الفعلي بعد إعداد مشروع Google
            window.location.href = 'https://accounts.google.com/o/oauth2/auth?' +
                'response_type=code&' +
                'client_id=YOUR_GOOGLE_CLIENT_ID&' +
                'redirect_uri=https://top4cryptoshop.onrender.com/api/auth/google/callback&' +
                'scope=email profile&' +
                'state=random_state_string';
        });

        // 2. تسجيل الدخول عبر Apple
        document.getElementById('appleSignIn').addEventListener('click', () => {
            // سيتم استبدال هذا بالتنفيذ الفعلي بعد إعداد Apple Developer Account
            window.location.href = 'https://appleid.apple.com/auth/authorize?' +
                'client_id=YOUR_APPLE_SERVICE_ID&' +
                'redirect_uri=https://top4cryptoshop.onrender.com/api/auth/apple/callback&' +
                'response_type=code&' +
                'scope=email name&' +
                'response_mode=form_post';
        });

        // 3. التسجيل التقليدي
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // إخفاء رسائل الخطأ السابقة
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            
            // إخفاء رسالة الخطأ العامة
            const generalError = document.getElementById('generalError');
            generalError.classList.remove('show');
            generalError.textContent = '';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const fullPhoneNumber = countryCode + phoneNumber;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        email: email || undefined,
                        phone: fullPhoneNumber
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'حدث خطأ أثناء التسجيل');
                }

                // إذا نجح التسجيل
                alert('تم تسجيل الحساب بنجاح!');
                window.location.href = '/homepage.html';

            } catch (err) {
                console.error('Error:', err);
                
                // عرض رسائل الخطأ المناسبة
                if (err.message.includes('اسم المستخدم')) {
                    showError('usernameError', err.message);
                } else if (err.message.includes('كلمة المرور')) {
                    showError('passwordError', err.message);
                } else if (err.message.includes('الهاتف')) {
                    showError('phoneError', err.message);
                } else if (err.message.includes('البريد')) {
                    showError('emailError', err.message);
                } else {
                    // عرض رسالة خطأ عامة
                    generalError.textContent = err.message;
                    generalError.classList.add('show');
                }
            }
        });

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }
    </script>
</body>
</html>
