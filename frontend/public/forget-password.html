<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - متجر العملات الرقمية</title>
    <style>
        :root {
            --beige: #F5F5DC;
            --chocolate: #D2691E;
            --dark-chocolate: #8B4513;
        }
        
        body {
            font-family: 'Tahoma', sans-serif;
            background: var(--beige);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        
        .password-container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.1);
            border: 1px solid var(--chocolate);
        }
        
        h2 {
            color: var(--dark-chocolate);
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
            width: 100%;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--chocolate);
            border-radius: 6px;
            font-size: 1rem;
            background: rgba(210, 105, 30, 0.05);
            box-sizing: border-box;
        }
        
        .submit-btn-container {
            width: 100%;
            margin-top: 0.5rem;
        }
        
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            background-color: var(--chocolate);
            color: white;
            font-weight: bold;
            box-sizing: border-box;
        }
        
        .password-links {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .password-links a {
            color: var(--dark-chocolate);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin: 0 5px;
        }
        
        .password-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h2>استعادة كلمة المرور</h2>
        
        <form id="forgotPasswordForm">
            <div class="form-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            </div>
            <div class="submit-btn-container">
                <button type="submit">إرسال رابط الاستعادة</button>
            </div>
        </form>
        
        <div class="password-links">
            <a href="login.html">العودة إلى تسجيل الدخول</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ email })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني');
                } else {
                    alert(result.error || 'حدث خطأ أثناء محاولة استعادة كلمة المرور');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('حدث خطأ أثناء الاتصال بالخادم. الرجاء المحاولة لاحقاً.');
            }
        });
    </script>
</body>
</html>
