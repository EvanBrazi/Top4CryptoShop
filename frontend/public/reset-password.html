<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - متجر العملات الرقمية</title>
    <style>
        :root {
            --beige: #F5F5DC;
            --chocolate: #D2691E;
            --dark-chocolate: #8B4513;
        }
        
        body {
            font-family: 'Tahoma', sans-serif;
            background: var(--beige);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        
        .reset-container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.1);
            border: 1px solid var(--chocolate);
        }
        
        h2 {
            color: var(--dark-chocolate);
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
            width: 100%;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--chocolate);
            border-radius: 6px;
            font-size: 1rem;
            background: rgba(210, 105, 30, 0.05);
            box-sizing: border-box;
        }
        
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            background-color: var(--chocolate);
            color: white;
            font-weight: bold;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>إعادة تعيين كلمة المرور</h2>
        
        <form id="resetPasswordForm">
            <input type="hidden" id="token">
            <div class="form-group">
                <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
            </div>
            <button type="submit">تحديث كلمة المرور</button>
        </form>
    </div>

    <script>
        // استخراج التوكن من URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        document.getElementById('token').value = token;

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('كلمتا المرور غير متطابقتين');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        token: document.getElementById('token').value,
                        newPassword
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('تم تحديث كلمة المرور بنجاح');
                    window.location.href = 'login.html';
                } else {
                    alert(result.error || 'حدث خطأ أثناء محاولة تحديث كلمة المرور');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('حدث خطأ أثناء الاتصال بالخادم. الرجاء المحاولة لاحقاً.');
            }
        });
    </script>
</body>
</html>
