<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - متجر العملات الرقمية</title>
    <link rel="stylesheet" href="./assets/css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="day-theme">
    <div class="container">
        <h2>تسجيل الدخول</h2>

        <!-- رسالة خطأ عامة -->
        <div id="generalError" class="general-error"></div>

        <!-- زر تسجيل الدخول عبر Google -->
        <button class="btn-google" id="googleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20"
                alt="Google">
            تسجيل الدخول عبر Google
        </button>

        <!-- زر تسجيل الدخول عبر Apple -->
        <button class="btn-apple" id="appleSignIn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="20" alt="Apple">
            تسجيل الدخول عبر Apple
        </button>

        <div class="divider">أو</div>

        <!-- نموذج تسجيل الدخول التقليدي -->
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="اسم المستخدم" required autocomplete="username">
                <div id="usernameError" class="error-message"></div>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="كلمة المرور" required minlength="8"
                    autocomplete="current-password">
                <div id="passwordError" class="error-message"></div>
                <div id="attemptsWarning" class="error-message"></div>

            </div>
            <!-- إضافة مؤشر تحميل -->
            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnText">تسجيل الدخول</span>
                <div id="spinner" class="spinner"></div>
            </button>
            <label class="remember-device">
                <input type="checkbox" id="rememberDevice" />
                <span>تذكرني</span>
            </label>
        </form>
        <div class="bottom-divider"></div>
        <div class="register">
            <a href="forget-password.html">نسيت كلمة المرور؟</a> |
            <a href="register.html">إنشاء حساب جديد</a>
        </div>
    </div>
    <div id="twofa-overlay" class="twofa-overlay" style="display: none;">
        <div class="twofa-modal">
            <h3>🔐 المصادقة الثنائية</h3>
            <p>يرجى إدخال رمز التحقق من تطبيق Google Authenticator:</p>
            <input type="text" id="twofa-token-input" placeholder="رمز المصادقة" />
            <div class="twofa-actions">
                <button id="verify-2fa-login-btn" class="btn success">✅ تحقق</button>
                <button id="cancel-2fa-btn" class="btn danger">❌ إلغاء</button>
            </div>
            <div id="twofa-status-message" class="twofa-status"></div>
        </div>
    </div>
    <script src="assets/js/utils/loader.js" defer></script>
    <script type="module" src="./assets/js/login.js"></script>
</body>

</html>
